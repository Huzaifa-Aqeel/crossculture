name: Checks

on:
  push:
  pull_request:

jobs:
  api:
    name: API offline checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # Fixture checks only: no provider credentials or database are used.
      - run: npm test

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Placeholder public values so the production build can compile.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      CROSSCULTURE_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
